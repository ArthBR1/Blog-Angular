      cardDescription="A Bola de Ouro (em francês, Ballon d'Or) é o prêmio individual mais cobiçado do futebol mundial, concedido anualmente ao melhor jogador do planeta. Criado em 1956 pela revista francesa France Football, o troféu reconhece o desempenho excepcional de atletas com base em votação de jornalistas especializados, técnicos e capitães de seleções.
      Originalmente, apenas jogadores europeus podiam concorrer, mas a partir de 1995, o prêmio foi aberto a atletas de qualquer nacionalidade que atuassem em clubes europeus. Em 2022, a organização modificou o critério, passando a considerar o ano civil (e não mais a temporada europeia) e incluindo a Copa do Mundo como um dos torneios mais relevantes na avaliação.
      Lionel Messi detém o recorde de vitórias, com 8 Bolas de Ouro, seguido por Cristiano Ronaldo, que venceu 5 vezes. Outros lendários ganhadores incluem Pelé (que recebeu um prêmio honorário em 2013), Johan Cruyff, Michel Platini, Ronaldo Nazário e Zinedine Zidane.
      Além da premiação masculina, desde 2018 existe também a Bola de Ouro Feminina, que já consagrou estrelas como Megan Rapinoe e Alexia Putellas.
      Sinônimo de excelência no futebol, a Bola de Ouro continua a ser o ápice do reconhecimento individual no esporte mais popular do mundo."
